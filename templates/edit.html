{% extends 'base.html' %}{% block title %}Edit application · JobFlow{% endblock %}{% block content %}<div class="hero"><div><div class="eyebrow">APPLICATION DETAILS</div><h1>Edit application</h1><p class="muted">Keep this opportunity up to date.</p></div><a class="btn secondary" href="{{ url_for('job_details', job_id=job[0]) }}">← Back to details</a></div><div class="card"><form method="post"><div class="form-grid"><div class="field"><label>Company *</label><input name="company" value="{{ job[1] or '' }}" required></div><div class="field"><label>Position *</label><input name="position" value="{{ job[2] or '' }}" required></div><div class="field"><label>Location</label><input name="location" value="{{ job[3] or '' }}"></div><div class="field"><label>Status</label><select name="status">{% for status in ['Applied','Interview','Offer','Rejected'] %}<option {% if job[4]==status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></div><div class="field"><label>Application date</label><input type="date" name="applied_date" value="{{ job[5].isoformat() if job[5] else '' }}"></div><div class="field"><label>Interview date</label><input type="date" name="interview_date" value="{{ job[9].isoformat() if job[9] else '' }}"></div><div class="field"><label>Salary</label><input name="salary" value="{{ job[8] or '' }}"></div><div class="field"><label>Job URL</label><input type="url" name="job_url" value="{{ job[7] or '' }}"></div><div class="field full"><label>Notes</label><textarea name="notes">{{ job[6] or '' }}</textarea></div></div><div class="actions" style="margin-top:18px"><button>Save changes</button><a class="btn secondary" href="{{ url_for('home') }}">Cancel</a></div></form></div>{% endblock %}
